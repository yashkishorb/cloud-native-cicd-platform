services:
  app:
    image: ${DOCKER_IMAGE:-cloud-native-cicd-platform-app:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cicd_app
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: cicd_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_network:
    driver: bridge
